name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SpaceIsland/SpaceIsland.csproj

      - name: Build
        run: dotnet build SpaceIsland/SpaceIsland.csproj -c Release --no-restore

      - name: Publish single file
        run: >
          dotnet publish SpaceIsland/SpaceIsland.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceIsland-win-x64
          path: publish/SpaceIsland.exe
          if-no-files-found: error
